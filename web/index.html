<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inty - Type Checker for JavaScript and Python</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
    <div class="backdrop">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="window">
        <div class="title-bar">
            <div class="traffic" aria-hidden="true">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="title">
                <span class="title-name">Inty</span>
                <span class="title-sep">·</span>
                <span class="title-sub" id="title-sub">JavaScript Type Checker</span>
            </div>
            <div class="title-actions">
                <span class="credits">by <span class="credit-name">Noam Lewis</span></span>
                <div class="lang-toggle" role="group" aria-label="Source language">
                    <button id="lang-js" class="lang-btn active" type="button" data-lang="javascript" aria-pressed="true" title="Check JavaScript">JS</button>
                    <button id="lang-py" class="lang-btn" type="button" data-lang="python" aria-pressed="false" title="Check Python">Py</button>
                </div>
                <button id="sidebar-toggle" class="chip sidebar-toggle" type="button" title="Show or hide the examples panel" aria-label="Examples" aria-pressed="true">
                    <span class="sidebar-toggle-icon" aria-hidden="true">
                        <span></span><span></span><span></span>
                    </span>
                    <span class="chip-label">Examples</span>
                </button>
                <button id="hints-btn" class="chip" type="button" title="Show or hide inline type hints" aria-label="Type hints" aria-pressed="true">
                    <svg class="chip-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.6V3.5a1 1 0 0 1 1-1h5.1a1 1 0 0 1 .7.3l4.4 4.4a1 1 0 0 1 0 1.4l-5.1 5.1a1 1 0 0 1-1.4 0L2.8 9.3a1 1 0 0 1-.3-.7Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="5.6" cy="5.6" r="1.1" fill="currentColor"/></svg>
                    <span class="chip-label" id="hints-label">Hints on</span>
                </button>
                <button id="share-btn" class="chip" type="button" title="Copy a link to this snippet" aria-label="Share link">
                    <svg class="chip-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 9.2a2.8 2.8 0 0 0 4 0l2.3-2.3a2.8 2.8 0 0 0-4-4l-.9.9M9.2 6.8a2.8 2.8 0 0 0-4 0L2.9 9.1a2.8 2.8 0 0 0 4 4l.9-.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span class="chip-label" id="share-label">Share link</span>
                </button>
                <span class="status" id="status" role="status" title="Type checker status"><span class="status-text">Loading…</span></span>
                <a href="https://github.com/sinelaw/inty" target="_blank" rel="noopener noreferrer" class="github-link" title="sinelaw/inty on GitHub" aria-label="Inty on GitHub">
                    <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                    <span class="github-label">GitHub</span>
                </a>
            </div>
        </div>

        <div class="body">
            <aside class="sidebar" id="sidebar" aria-label="Examples">
                <div class="sidebar-header">
                    <span class="sidebar-title">Examples</span>
                    <span class="sidebar-hint">Click a file to load it</span>
                </div>
                <nav class="tree" id="tree" aria-label="Example files"></nav>
                <div class="sidebar-footer">
                    <span class="dot-status" id="example-status" aria-hidden="true"></span>
                    <span id="example-blurb">Pick an example to begin</span>
                </div>
            </aside>

            <main class="main">
                <div class="editor-container">
                    <textarea id="input-editor"></textarea>
                </div>

                <div class="error-bar" id="error-panel">
                    <div class="error-bar-header">
                        <span id="error-summary">Errors</span>
                        <button id="close-errors" aria-label="Dismiss errors">×</button>
                    </div>
                    <div class="error-content" id="error-content"></div>
                </div>
            </main>
        </div>

        <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
    </div>

    <div id="hover-tooltip" class="hover-tooltip" role="tooltip"></div>

    <div id="demo-cursor" class="demo-cursor" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="demo-cursor-arrow">
            <path d="M3 2 L3 18 L7.5 13.5 L10.5 21 L13.5 19.5 L10.5 12 L17 12 Z"
                fill="#ffffff" stroke="#0a0c14" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        <span class="demo-cursor-ring"></span>
        <span class="demo-cursor-caption" id="demo-cursor-caption"></span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script type="module" src="app.js?v=12"></script>
    <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "0858f4857c744e418bce27f9577ea9d2"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
