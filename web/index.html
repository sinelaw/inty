<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inty - Type Checker for JavaScript and Python</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
    <div class="backdrop">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="window">
        <div class="title-bar">
            <div class="traffic" aria-hidden="true">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="title">
                <span class="title-name">Inty</span>
                <span class="title-sep">·</span>
                <span class="title-sub" id="title-sub">JavaScript Type Checker</span>
            </div>
            <div class="title-actions">
                <span class="credits">
                    by <span class="credit-name">Noam Lewis</span>
                    <span class="credit-sep">·</span>
                    <a href="https://github.com/sinelaw/inty" target="_blank" rel="noopener noreferrer" class="credit-link">github.com/sinelaw/inty</a>
                </span>
                <div class="lang-toggle" role="group" aria-label="Source language">
                    <button id="lang-js" class="lang-btn active" type="button" data-lang="javascript" aria-pressed="true" title="Check JavaScript">JS</button>
                    <button id="lang-py" class="lang-btn" type="button" data-lang="python" aria-pressed="false" title="Check Python">Py</button>
                </div>
                <button id="sidebar-toggle" class="chip sidebar-toggle" title="Show or hide the examples panel" aria-pressed="true">
                    <span class="sidebar-toggle-icon" aria-hidden="true">
                        <span></span><span></span><span></span>
                    </span>
                    <span class="sidebar-toggle-label">Examples</span>
                </button>
                <button id="hints-btn" class="chip" title="Show or hide inline type hints">Hints on</button>
                <button id="share-btn" class="chip" title="Copy a link to this snippet">Share link</button>
                <span class="status" id="status">Loading…</span>
                <a href="https://github.com/sinelaw/inty" target="_blank" rel="noopener noreferrer" class="github-link" title="View on GitHub">
                    <img src="github-mark.svg" alt="GitHub" class="github-icon">
                </a>
            </div>
        </div>

        <div class="body">
            <aside class="sidebar" id="sidebar" aria-label="Examples">
                <div class="sidebar-header">
                    <span class="sidebar-title">Examples</span>
                    <span class="sidebar-hint">Click a file to load it</span>
                </div>
                <nav class="tree" id="tree" aria-label="Example files"></nav>
                <div class="sidebar-footer">
                    <span class="dot-status" id="example-status" aria-hidden="true"></span>
                    <span id="example-blurb">Pick an example to begin</span>
                </div>
            </aside>

            <main class="main">
                <div class="editor-container">
                    <textarea id="input-editor"></textarea>
                </div>

                <div class="error-bar" id="error-panel">
                    <div class="error-bar-header">
                        <span id="error-summary">Errors</span>
                        <button id="close-errors" aria-label="Dismiss errors">×</button>
                    </div>
                    <div class="error-content" id="error-content"></div>
                </div>
            </main>
        </div>

        <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
    </div>

    <div id="hover-tooltip" class="hover-tooltip" role="tooltip"></div>

    <div id="demo-cursor" class="demo-cursor" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="demo-cursor-arrow">
            <path d="M3 2 L3 18 L7.5 13.5 L10.5 21 L13.5 19.5 L10.5 12 L17 12 Z"
                fill="#ffffff" stroke="#0a0c14" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        <span class="demo-cursor-ring"></span>
        <span class="demo-cursor-caption" id="demo-cursor-caption"></span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script type="module" src="app.js?v=11"></script>
    <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "0858f4857c744e418bce27f9577ea9d2"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
