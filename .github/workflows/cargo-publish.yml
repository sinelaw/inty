# Publish the workspace's crates to crates.io.
#
# The crates depend on each other through [workspace.dependencies] in the
# root Cargo.toml. Each entry there has a path (used for builds) and an
# exact version (used by `cargo publish`, since crates.io rejects
# path-only dependencies). This workflow sets the release version in both
# places, then publishes in dependency order:
#   inty -> inty-lsp, inty-bundle, inty-go -> inty-cli
# A crate version that is already on crates.io is skipped, so a
# partially failed run can simply be re-run.

name: Publish to crates.io

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set version to ${{ inputs.version }}
        run: |
          # [workspace.package] version, inherited by every crate.
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          # The exact-version pins on the internal crates.
          sed -i -E "s|(\{ path = \"crates/[^\"]+\", version = \")=[^\"]*\"|\1=${VERSION}\"|" Cargo.toml
          grep -n "version = " Cargo.toml
          pins=$(grep -c "path = \"crates/.*version = \"=${VERSION}\"" Cargo.toml)
          if [ "$pins" -ne 4 ]; then
            echo "expected 4 internal dependency pins at ${VERSION}, found ${pins}" >&2
            exit 1
          fi

      - name: Check every crate packages
        # Separate target dir; see the same step in rust.yml.
        run: cargo package --workspace --allow-dirty --target-dir target/package-check

      - name: Publish
        run: |
          publish() {
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "inty-release (https://github.com/sinelaw/inty)" \
              "https://crates.io/api/v1/crates/$1/${VERSION}")
            if [ "$status" = "200" ]; then
              echo "$1 ${VERSION} is already on crates.io; skipping"
            else
              cargo publish --allow-dirty -p "$1"
            fi
          }
          # Dependency order. `cargo publish` waits until each crate is
          # available in the index before returning.
          publish inty
          publish inty-lsp
          publish inty-bundle
          publish inty-go
          publish inty-cli
