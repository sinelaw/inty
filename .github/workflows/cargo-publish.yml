# Publish inty, inty-lsp, and inty-cli to crates.io.
#
# Path-only dependencies between the crates are rewritten to include the
# matching version so `cargo publish` accepts them. Crates are published
# in dependency order: inty -> inty-lsp -> inty-cli.

name: Publish to crates.io

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set workspace version to ${{ inputs.version }}
        run: |
          # All three crates inherit version from [workspace.package] in the root Cargo.toml.
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml

      - name: Add version to internal path dependencies
        run: |
          # Path-only deps need a version key for crates.io.
          sed -i -E "s|inty = \\{ path = \"\\.\\./inty\" \\}|inty = { path = \"../inty\", version = \"=${VERSION}\" }|g" \
            crates/inty-lsp/Cargo.toml crates/inty-cli/Cargo.toml
          sed -i -E "s|inty-lsp = \\{ path = \"\\.\\./inty-lsp\" \\}|inty-lsp = { path = \"../inty-lsp\", version = \"=${VERSION}\" }|g" \
            crates/inty-cli/Cargo.toml

      - name: Publish inty
        run: cargo publish --allow-dirty -p inty

      - name: Publish inty-lsp
        run: cargo publish --allow-dirty -p inty-lsp

      - name: Publish inty-cli
        run: cargo publish --allow-dirty -p inty-cli
