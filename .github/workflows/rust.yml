name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    # Builds every crate from its would-be crates.io tarball, so a
    # dependency crates.io would reject (e.g. path-only) fails here rather
    # than at release time. A separate target dir: the verification builds
    # resolve against a temporary registry, and sharing `target/` with the
    # normal build can leave two copies of a dependency behind.
    - name: Check the crates package for crates.io
      run: cargo package --workspace --allow-dirty --target-dir target/package-check
